<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Seal</title>
<link rel="icon" type="image/svg+xml" href="/khatm.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap">
<style>
:root{--bg:#F5F6F8;--panel:#fff;--ink:#111827;--muted:#4B5563;--soft:#6B7280;--line:#E5E7EB;--line2:#F1F2F4;
  --brand:#0F5C55;--brand-d:#0B4A44;--brand-l:#E7F3F1;--side:#0E1B22;--side2:#16262F;--side-ink:#C9D4DA;
  --good:#166534;--good-bg:#DCFCE7;--warn:#92400E;--warn-bg:#FEF3C7;--bad:#991B1B;--bad-bg:#FEE2E2;--info:#1E40AF;--info-bg:#DBEAFE}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,sans-serif}
button{font:inherit;font-size:13px;font-weight:500;padding:7px 12px;border-radius:7px;border:1px solid #D1D5DB;background:#fff;color:var(--ink);cursor:pointer}
button:hover{background:#F9FAFB}button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff}button.primary:hover{background:var(--brand-d)}
button.danger{background:#fff;border-color:#FCA5A5;color:var(--bad)}button.danger:hover{background:#FEF2F2}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid #F59E0B;outline-offset:2px}
.mono{font-family:'IBM Plex Mono',monospace}

/* shell */
.app{display:grid;grid-template-columns:232px 1fr;grid-template-rows:56px 1fr;height:100vh}
.top{grid-column:1/3;display:flex;align-items:center;gap:18px;padding:0 18px;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;width:196px;font-weight:600;font-size:16px}
.brand img{width:30px;height:30px}
.org{color:var(--muted);font-size:13.5px}
.top .sp{flex:1}
.clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.clock b{font-weight:600;font-variant-numeric:tabular-nums}.clock small{color:var(--soft);font-size:11.5px}
.clock.jump b{color:var(--brand)}
.bell{position:relative;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;cursor:pointer;padding:0}
.bell .n[hidden]{display:none}.bell .n{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:#DC2626;color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 5px}
.user{display:flex;align-items:center;gap:9px;font-size:13px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brand-l);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px}
.user small{display:block;color:var(--soft);font-size:11.5px}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:14px 10px;gap:2px;overflow:auto}
.side a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:7px;color:var(--side-ink);text-decoration:none;font-size:13.5px;cursor:pointer}
.side a:hover{background:var(--side2)}.side a.on{background:#1F3640;color:#fff;font-weight:500}
.side .cnt{font-size:11.5px;background:#24404B;color:#E2E8F0;border-radius:9px;padding:1px 7px;font-variant-numeric:tabular-nums}
.side .cnt.red{background:#B91C1C;color:#fff}
.side .sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#7D8E97;padding:14px 10px 6px}
.side .sp{flex:1}
.status{font-size:11.5px;line-height:1.5;color:#93A3AB;padding:10px;border-top:1px solid #22343D;margin-top:8px}
.status b{color:#E2E8F0;font-weight:500}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#34D399;margin-right:6px;vertical-align:middle}
.live-dot.busy{background:#FBBF24;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.3}}
main{overflow:auto;min-width:0}
.view{padding:18px 22px 40px}
.vh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.vh h1{margin:0;font-size:19px;font-weight:600}.vh .sub{color:var(--soft);font-size:13px}

/* common */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.ph{padding:11px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
.ph h2{margin:0;font-size:14px;font-weight:600}.ph .sub{font-size:12px;color:var(--soft)}
.tag{display:inline-block;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:5px;white-space:nowrap}
.t-green{background:var(--good-bg);color:var(--good)}.t-amber{background:var(--warn-bg);color:var(--warn)}.t-red{background:var(--bad-bg);color:var(--bad)}
.t-blue{background:var(--info-bg);color:var(--info)}.t-grey{background:#F3F4F6;color:#374151}.t-live{background:#111827;color:#34D399}
table.grid{width:100%;border-collapse:collapse;font-size:13.5px}
.grid th{text-align:left;font-size:12px;font-weight:500;color:var(--soft);padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.grid td{padding:10px 14px;border-bottom:1px solid var(--line2);vertical-align:top}
.grid tr.click{cursor:pointer}.grid tr.click:hover td{background:#F9FAFB}
.grid tr.warn td{background:#FFFBEB}.grid tr.bad td{background:#FEF2F2}
.small{font-size:12px;color:var(--soft)}
.empty{padding:28px 18px;color:var(--soft);text-align:center}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.stat .k{font-size:12px;color:var(--soft)}.stat .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}

/* inbox */
.inbox{display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px;align-items:start}
.mlist{max-height:calc(100vh - 210px);overflow:auto}
.mi{padding:11px 14px;border-bottom:1px solid var(--line2);cursor:pointer;display:flex;flex-direction:column;gap:4px}
.mi:hover{background:#F9FAFB}.mi.on{background:var(--brand-l);box-shadow:inset 3px 0 0 var(--brand)}
.mi .r1{display:flex;justify-content:space-between;gap:8px}.mi .from{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .when{font-size:12px;color:var(--soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.mi .subj{font-size:13px;color:#374151;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;padding:1px 7px;border-radius:4px;background:#F3F4F6;color:#374151;border:1px solid var(--line);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi.new{animation:arrive 1.2s ease-out}@keyframes arrive{from{background:#FEF9C3}to{background:transparent}}
.detail{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.3fr);gap:14px;align-items:start}
.mail .mh{padding:14px 16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:62px 1fr;gap:3px 10px;font-size:13px}
.mail .mh span{color:var(--soft)}.mail h3{margin:0 0 4px;font-size:16px;grid-column:1/3}
.mail .mb{padding:14px 16px;white-space:pre-wrap;font-size:13.5px;line-height:1.6}
.mail .att{padding:0 16px 14px}
.sent{border-top:1px solid var(--line)}
.sent .s{padding:12px 16px;border-bottom:1px solid var(--line2)}
.sent .s .meta{font-size:12px;color:var(--soft);margin-bottom:4px}
.sent .s .body{white-space:pre-wrap;font-size:13px;line-height:1.55;color:#374151}
.handled .story{padding:12px 16px;font-size:13.5px;line-height:1.55;border-bottom:1px solid var(--line)}
.sect{padding:12px 16px 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--soft);font-weight:500}

/* activity */
ol.act{list-style:none;margin:0;padding:4px 16px 12px;display:flex;flex-direction:column;gap:0}
.act li{display:grid;grid-template-columns:46px 14px 1fr;gap:8px;padding:6px 0;align-items:start;font-size:13px}
.act .tm{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--soft);padding-top:1px}
.act .dt{width:9px;height:9px;border-radius:50%;background:#9CA3AF;margin-top:5px}
.dt.g{background:#16A34A}.dt.y{background:#D97706}.dt.r{background:#DC2626}.dt.b{background:#2563EB}
.act .d{display:block;font-size:12.5px;color:var(--soft)}
.act li.stop .m{color:var(--bad);font-weight:500}
.act li.divider{display:block;text-align:center;font-size:11.5px;color:var(--brand);font-weight:500;padding:8px 0;position:relative}
.act li.divider::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed #9FC9C3}
.act li.divider span{position:relative;background:#fff;padding:0 10px}
.act li.working .m{color:var(--brand)}
.spin{width:12px;height:12px;border:2px solid #A7D3CD;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin-top:3px}
@keyframes spin{to{transform:rotate(360deg)}}
.act li.newline{animation:fadein .5s ease-out}@keyframes fadein{from{opacity:0;transform:translateY(4px)}}
details.chk summary{cursor:pointer;list-style:none}details.chk summary::-webkit-details-marker{display:none}
details.chk summary .m::after{content:"  Show checklist";color:var(--brand);font-size:12px;font-weight:500}
details.chk[open] summary .m::after{content:"  Hide checklist"}
.rules{margin:8px 0 2px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rule{display:grid;grid-template-columns:44px 1fr auto;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line2);font-size:12.5px;align-items:start}
.rule:last-child{border-bottom:0}
.rule .ok{color:var(--good);font-weight:600;font-size:11px}.rule .no{color:var(--bad);font-weight:600;font-size:11px}
.rule .c{color:var(--soft);font-size:12px;word-break:break-word}
.src{font-size:10.5px;padding:1px 6px;border-radius:4px;background:#F3F4F6;color:#374151;white-space:nowrap}
.src.Wathq,.src.ZATCA{background:#EEF2FF;color:#3730A3}.src.cross-document{background:#ECFEFF;color:#155E75}.src.policy\.yaml{background:#F5F3FF;color:#5B21B6}

/* documents */
.res{font-weight:500}.res.ok{color:var(--good)}.res.warn{color:var(--warn)}.res.bad{color:var(--bad)}.res.na{color:var(--soft);font-weight:400}
.grid tr.reading td{color:var(--soft)}
.grid tr.newrow td{animation:arrive 1.2s ease-out}

/* decision */
.decision{margin:12px 16px;border:1px solid #FCA5A5;border-radius:10px;padding:14px 16px;background:#FFFBFB;display:flex;flex-direction:column;gap:10px}
.decision .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--bad);font-weight:600}
.decision h3{margin:0;font-size:16px;color:var(--bad)}
.decision p{margin:0;font-size:13.5px;color:#374151}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.compare div{border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:13px;background:#fff}
.compare small{display:block;font-size:11.5px;color:var(--soft)}.compare .x{border-color:#FCA5A5;background:#FEF2F2}
.flags{display:flex;flex-wrap:wrap;gap:6px}.flag{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--bad-bg);color:var(--bad);font-weight:500}
.call{padding:8px 10px;border-radius:7px;background:#FFF7ED;border:1px solid #FED7AA;font-size:13.5px}
.choices{display:flex;flex-wrap:wrap;gap:8px}

/* drawer (document viewer, vendor record) */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(1060px,96vw);background:#fff;z-index:41;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.drawer .dh h2{margin:0;font-size:16px}
.drawer .db{flex:1;overflow:auto;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.pagewrap{background:#E5E7EB;padding:18px;overflow:auto}
.page{position:relative;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.page img{display:block;width:100%}
.hl{position:absolute;border:2px solid #F59E0B;background:rgba(251,191,36,.18);border-radius:3px;pointer-events:none}
.hl.type{border-color:#2563EB;background:rgba(37,99,235,.12)}.hl.on{border-width:3px;background:rgba(251,191,36,.38)}
.why{padding:18px;display:flex;flex-direction:column;gap:14px}
.why h3{margin:0;font-size:17px}.why .conf{color:var(--soft);font-weight:400}
.ev{display:flex;flex-wrap:wrap;gap:6px}.evq{font-size:13px;padding:3px 8px;border-radius:5px;background:#EFF6FF;border:1px solid #BFDBFE;color:#1E3A8A}
.fields .f{display:grid;grid-template-columns:120px 1fr 44px;gap:8px;padding:7px 0;border-bottom:1px solid var(--line2);font-size:13px;cursor:default}
.fields .f:hover{background:#FFFBEB}.fields .f .q{display:block;font-size:12px;color:var(--soft)}
.note{font-size:12px;color:var(--soft);background:#F9FAFB;border:1px solid var(--line);border-radius:7px;padding:8px 10px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;padding:14px 18px;font-size:13.5px}.kv span{color:var(--soft)}

/* rules & about */
pre.policy{margin:0;padding:16px 18px;font:12.5px/1.6 'IBM Plex Mono',monospace;white-space:pre-wrap;color:#1F2937}
.about p{max-width:760px;line-height:1.6}

/* presenter overlay (hidden by default; H toggles) */
.presenter{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(820px,94vw);background:#0B1720;color:#E5E7EB;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.35);z-index:60;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.presenter[hidden]{display:none}
.presenter .pt{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:#8FA3AD;text-transform:uppercase;letter-spacing:.08em}
.presenter h3{margin:0;font-size:16px;color:#fff}
.presenter p{margin:0;font-size:14px;line-height:1.55;color:#CBD5DB}
.presenter .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.presenter button{background:#16262F;border-color:#2A404B;color:#E5E7EB}
.presenter button.primary{background:#14B8A6;border-color:#14B8A6;color:#06201D}
.presenter select{font:inherit;font-size:13px;background:#16262F;color:#E5E7EB;border:1px solid #2A404B;border-radius:7px;padding:6px 8px;max-width:300px}
.presenter .keys{font-size:11.5px;color:#7D8E97}
.presenter .msg{font-size:12.5px;color:#FCD34D}
@media (max-width:1100px){.detail{grid-template-columns:1fr}.inbox{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div class="app">
  <header class="top">
    <div class="brand"><img src="/khatm.svg" alt=""><span>The Seal</span></div>
    <span class="org">Demo Company · Procurement</span>
    <span class="sp"></span>
    <div class="clock" id="clock" aria-live="off"><b id="clock-t">--</b><small id="clock-d">--</small></div>
    <button class="bell" id="bell" aria-label="Notifications" onclick="openFirstDecision()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span class="n" id="bell-n" hidden>0</span></button>
    <div class="user"><div class="avatar">PM</div><div>Procurement manager<small>Demo Company</small></div></div>
  </header>
  <nav class="side" aria-label="Main">
    <a data-v="inbox" onclick="go('inbox')">Inbox <span class="cnt" id="n-inbox">0</span></a>
    <a data-v="suppliers" onclick="go('suppliers')">Suppliers <span class="cnt" id="n-suppliers">0</span></a>
    <a data-v="vendors" onclick="go('vendors')">Approved vendors <span class="cnt" id="n-vendors">0</span></a>
    <a data-v="bank" onclick="go('bank')">Bank change requests <span class="cnt" id="n-bank">0</span></a>
    <a data-v="audit" onclick="go('audit')">Audit log</a>
    <a data-v="rules" onclick="go('rules')">Rules</a>
    <span class="sp"></span>
    <a data-v="about" onclick="go('about')">About</a>
    <div class="status" id="status"></div>
  </nav>
  <main id="main"></main>
</div>
<div id="drawer"></div>

<section class="presenter" id="presenter" hidden aria-label="Presenter controls">
  <div class="pt"><span id="p-step">Presenter</span><span class="keys">Right arrow / N next · B back · R start over · H hide</span></div>
  <h3 id="p-title"></h3>
  <p id="p-body"></p>
  <div class="row">
    <button onclick="presBack()">Back</button>
    <button class="primary" id="p-next" onclick="presNext()">Next</button>
    <button onclick="presRestart()">Start over</button>
    <span style="flex:1"></span>
    <select id="p-live" aria-label="Held-out case to process live"></select>
    <button onclick="processLive()">Process a new email</button>
  </div>
  <div class="msg" id="p-msg"></div>
</section>

<script>
let S = null, events = [], view = 'inbox', openCase = null, openEmail = null, drawer = null;
let checksCache = {}, busy = false, idleTimer = null, seenEmails = new Set(), seenDocs = new Set(), seenEvents = new Set(), firstLoad = true;
const DOC = {commercial_registration:'Commercial registration', vat_certificate:'VAT certificate', bank_letter:'Bank letter',
  gosi_certificate:'GOSI certificate', zakat_certificate:'Zakat certificate', other:'Other document'};
const DOC_LC = {commercial_registration:'commercial registration', vat_certificate:'VAT certificate', bank_letter:'bank letter',
  gosi_certificate:'GOSI certificate', zakat_certificate:'Zakat certificate', other:'other document'};
const FLAG = {sender_domain_mismatch:'Sent from a different email domain', bank_differs_from_file:'Different bank than on file',
  account_name_mismatch:'Account holder is someone else', iban_invalid:'IBAN is invalid'};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const J = s => { try { return typeof s === 'string' ? JSON.parse(s) : s } catch { return null } };
const D = s => new Date((s || '').length <= 10 ? s + 'T00:00:00' : s);
const fmtDate = s => s ? D(s).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) : '';
const fmtDay = s => D(s).toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'});
const fmtTime = s => (s || '').slice(11, 16);
const maskIban = i => i ? `${i.slice(0,4)} •••• ${i.slice(-4)}` : '';
const docList = ds => (ds || []).map(d => DOC_LC[d] || d).join(' and ');
const isLive = id => (id || '').startsWith('live-');

async function api(url, body) {
  const r = await fetch(url, body === undefined ? {} : {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}

// ------------------------------------------------------------------ data helpers
const bankCase = c => S.bank_changes.find(b => b.case_id === c.id);
const inbound = () => S.cases.flatMap(c => c.emails.filter(e => e.direction === 'in').map(e => ({...e, case: c})))
  .sort((a, b) => b.ts.localeCompare(a.ts) || b.id - a.id);
function companyName(c) {
  if (c.vendor) return c.vendor.name;
  const bc = bankCase(c); if (bc) { const v = S.vendors.find(v => v.id === bc.vendor_id); if (v) return v.name; }
  const cr = (c.documents || []).find(d => d.extraction && J(d.extraction).doc_type === 'commercial_registration');
  if (cr && J(cr.extraction).company_name) return J(cr.extraction).company_name;
  const subj = (c.emails.find(e => e.direction === 'in') || {}).subject || '';
  return subj.includes(' - ') ? subj.split(' - ').pop() : (c.supplier_name || c.id);
}
const caseEvents = c => events.filter(e => e.case_id === c.id);
const caseActive = c => busy && events.length && events[events.length - 1].case_id === c.id;
function caseTag(c) {
  const st = c.status, o = c.outcome || {};
  if (['reading','received','checking'].includes(st) || caseActive(c)) return ['t-blue', 'Processing'];
  if (bankCase(c)) return st === 'rejected' ? ['t-grey', 'Bank change rejected'] : st === 'approved' ? ['t-green', 'Bank change approved'] : ['t-red', 'Frozen · call needed'];
  if (st === 'rejected') return ['t-grey', 'Rejected'];
  if (st === 'approved') return ['t-green', 'Approved by manager'];
  if (o.decision === 'onboard') return ['t-green', 'Approved'];
  if (o.decision === 'escalate') return st === 'waiting_on_supplier' ? ['t-amber', 'Asked to explain'] : ['t-red', 'Needs decision'];
  if (o.decision === 'request_fix') return ['t-amber', 'Waiting on supplier'];

const runChecksEvents = c => events.filter(e => e.case_id === c.id && e.name === 'run_checks');

// ------------------------------------------------------------------ activity lines (every line names who and what)
function describe(e) {
  const out = J(e.output) || {}, inp = J(e.input) || {}, s = e.summary || '';
  if (s.startsWith('REFUSED')) return {c:'y', m:'A safety lock blocked an action', d: out.refused};
  switch (e.kind + ':' + (e.name || '')) {
    case 'system:email_received': {
      const m = s.match(/^Email from (\S+): (.*) \((\d+) attachments\)$/);
      return {c:'b', m: m ? `Email received from ${m[1]}` : s, d: m ? `"${m[2]}" · ${m[3]} attachment${m[3] === '1' ? '' : 's'}` : ''};
    }
    case 'llm:extract': { const m = s.match(/^read (.*) -> (\w+)$/); return m ? {m:`Read ${m[1]}`, d:`Identified as ${DOC_LC[m[2]] || m[2]}`} : {m:s}; }
    case 'llm:reread': return {c:'y', m:'Re-read a document carefully', d:'A number disagreed with another source, so it read it again before deciding'};
    case 'tool:run_checks': {
      const f = [...(out.risk_failures||[]), ...(out.fixable_failures||[])], n = (out.checks_passed || 0) + f.length;
      if (out.recommended === 'onboard') return {c:'g', m:`Ran ${n} checks: ${n} passed`, checks:true};
      if (out.recommended === 'request_fix') return {c:'y', m:`Ran ${n} checks: ${f.length} failed, fixable by the supplier`, checks:true};
      return {c:'r', m:`Ran ${n} checks: ${(out.risk_failures||[]).length} possible fraud risk`, checks:true};
    }
    case 'tool:check_registry': return {m:`Wathq: CR ${out.crNumber || ''} ${out.found === false ? 'not found' : 'is ' + (out.status || '')}`};
    case 'tool:check_vat': return {m:`ZATCA: VAT ${out.vatNumber || ''} ${out.registered ? 'registered' : 'not registered'}`};
    case 'tool:create_vendor': return {c:'g', m:`Added ${out.name} as an approved vendor`, d: out.vendor_id};
    case 'tool:send_email':
      if (inp.kind === 'welcome') return {c:'g', m:`Sent a welcome email to ${inp.to || out.to || 'the supplier'}`};
      if (inp.kind === 'request_fix') return {c:'y', m:`Emailed ${out.to || 'the supplier'} asking for a new ${docList(inp.documents_requested)}`};
      if (inp.kind === 'renewal') return {c:'y', m: s};
      return {m:`Sent an email to ${out.to || inp.to || ''}`};
    case 'tool:escalate': return {stop:true, c:'r', m:'Stopped and asked the procurement manager to decide', d: inp.reason};
    case 'tool:check_bank_change': {
      const fl = out.flags || [];
      return fl.length ? {c:'r', m:`Bank change request: ${fl.length} red flag${fl.length > 1 ? 's' : ''}`, d: fl.map(f => FLAG[f] || f).join(' · ')}
                       : {m:'Bank change request: no red flags', d:'Still needs a phone call'};
    }
    case 'tool:freeze_bank_change': return {stop:true, c:'r', m:'Froze the bank change and held payments', d:`Call ${out.callback_phone}, the number on file`};
    case 'tool:scan_expiries': {
      const parts = s.split('; '), n = (out || []).length;
      return {c: n ? 'y' : 'g', m: n ? `Daily expiry scan: ${n} document${n > 1 ? 's' : ''} need attention` : 'Daily expiry scan: everything in date', d: parts.slice(1).join(' · ')};
    }
    case 'tool:set_vendor_hold': return {c:'r', m: s};
    case 'human:decision': {
      const c = S && S.cases.find(c => c.id === e.case_id), who = c ? companyName(c) : '';
      const what = c && bankCase(c) ? `${who}'s bank change` : who;
      return {c:'g', m:`Procurement manager ${inp.action === 'reject' ? 'rejected' : inp.action === 'approve' ? 'approved' : 'asked about'} ${what}`, d: inp.note};
    }

}
function gapLabel(a, b) {

  const when = fmtDay(b) + (D(b).getFullYear() !== D(a).getFullYear() ? ' ' + D(b).getFullYear() : '');

}
function activity(list, opts = {}) {

    if (prev) { const g = gapLabel(prev.ts, e.ts); if (g) html += `<li class="divider"><span>${esc(g)}</span></li>`; }
    prev = e;
    const fresh = !seenEvents.has(e.id + e.ts) && !firstLoad ? 'newline' : '';
    const body = `<span class="m">${esc(d.m)}</span>${d.d ? `<span class="d">${esc(d.d)}</span>` : ''}`;
    let inner = body;
    if (d.checks && opts.caseObj) {
      const data = checksCache[opts.caseObj.id] && checksCache[opts.caseObj.id].data;
      inner = `<details class="chk" ${opts.openChecks ? 'open' : ''} ontoggle="openChecks['${opts.caseObj.id}']=this.open"><summary>${body}</summary>${data ? rulesHtml(data) : '<span class="d">Loading checklist...</span>'}</details>`;
    }
    html += `<li class="${d.stop ? 'stop' : ''} ${fresh}"><span class="tm">${fmtTime(e.ts)}</span><span class="dt ${d.c || ''}"></span><span>${inner}</span></li>`;
  }
  if (opts.working) html += `<li class="working"><span class="tm"></span><span class="spin"></span><span class="m">Working...</span></li>`;
  return html || '<li class="small" style="display:block;padding:10px 0">Nothing yet.</li>';
}
let openChecks = {};
function rulesHtml(data) {
  return `<div class="rules">${data.rules.map(r => `<div class="rule"><span class="${r.status === 'pass' ? 'ok' : 'no'}">${r.status === 'pass' ? 'PASS' : 'FAIL'}</span>
    <span><b style="font-weight:500">${esc(r.rule)}</b>${r.doc_label && !['bank_name_matches_cr','cr_name_matches_registry','cr_active','vat_registered','iban_valid'].includes(r.check) ? ' · ' + esc(r.doc_label) : ''}<span class="c" style="display:block">${esc(r.compared)}</span></span>
    <span class="src ${esc(r.source)}">${esc(r.source)}</span></div>`).join('')}</div>`;

    const link = v ? ` <a href="#" onclick="openVendor('${v.id}');return false">Open ${esc(v.name)}'s record</a>` : '';
    if (st === 'rejected') return `You called the number on file about the bank change request for ${name} and rejected it. <b>Bank details unchanged</b>; payments continue to the account on file.${link}`;
    if (st === 'approved') return `You confirmed by phone and approved the new bank account.${link}`;
    return `Someone asked to change where ${name} gets paid. <b>The Seal froze it</b> and held payments until you call the supplier.${link}`;
  }
  if (o.decision === 'onboard') return c.emails.filter(e => e.direction === 'in').length > 1

      const [cls, txt] = caseTag(c), first = c.emails.find(e => e.direction === 'in');
      return `<tr class="click" onclick="openEmailRow('${c.id}', ${lastInboundId(c)})"><td style="font-weight:500">${esc(companyName(c))}${isLive(c.id) ? ' <span class="tag t-live">Live</span>' : ''}</td><td>${esc(c.sender_email)}</td>
        <td>${first ? fmtDay(first.ts) + ' ' + fmtTime(first.ts) : ''}</td><td>${c.documents.length}</td><td><span class="tag ${cls}">${esc(txt)}</span></td></tr>`;
    }).join('')}</tbody></table>` : '<div class="empty">No applications yet.</div>'}</section></div>`;
}

function vendorTag(v) {
  if (v.status === 'on_hold') return ['t-red', (v.hold_reason || '').startsWith('bank change') ? 'Payments held · bank change' : 'Payments held · document expired'];
  if (v.status === 'at_risk') return ['t-amber', 'Renewal requested'];
  return ['t-green', 'Active'];
}
function lastScan() { return [...events].reverse().find(e => e.name === 'scan_expiries'); }
function viewVendors() {
  const scan = lastScan();
  let scanHtml = '';
  if (scan) {
    const rows = J(scan.output) || [], acts = events.filter(e => e.id > scan.id && !e.case_id && ['send_email','set_vendor_hold'].includes(e.name));
    const action = r => {
      const v = S.vendors.find(v => v.id === r.vendor_id) || {};
      const label = {commercial_registration:'Commercial Registration', vat_certificate:'VAT registration', gosi_certificate:'GOSI'}[r.doc_type] || r.doc_type;
      if (r.state === 'expired') return acts.some(e => e.name === 'set_vendor_hold' && e.vendor_id === r.vendor_id) ? 'Payments put on hold; manager notified' : 'Expired';
      return acts.some(e => e.name === 'send_email' && e.vendor_id === r.vendor_id && (e.summary || '').includes(label)) ? `Renewal request emailed to ${v.email || 'supplier'}` : 'Renewal due';
    };
    scanHtml = `<section class="panel" style="margin-bottom:14px"><div class="ph"><h2>Expiry scan · ${fmtDay(scan.ts)} ${D(scan.ts).getFullYear()}, ${fmtTime(scan.ts)}</h2><span class="sub">${rows.length} document${rows.length === 1 ? '' : 's'} need attention</span></div>
      ${rows.length ? `<table class="grid"><thead><tr><th>Vendor</th><th>Document</th><th>Expiry date</th><th>Days left</th><th>Action taken</th></tr></thead><tbody>${rows.map(r => {
        const v = S.vendors.find(v => v.id === r.vendor_id) || {};
        return `<tr class="${r.state === 'expired' ? 'bad' : 'warn'}"><td style="font-weight:500">${esc(v.name || r.vendor_id)}</td><td>${esc(DOC[r.doc_type] || r.doc_type)}</td>
          <td>${fmtDate(r.expiry_date)}</td><td>${r.days_left < 0 ? 'Expired ' + (-r.days_left) + ' days ago' : r.days_left + ' days'}</td><td>${esc(action(r))}</td></tr>`;
      }).join('')}</tbody></table>` : '<div class="empty">Every document is in date.</div>'}</section>`;
  }
  return `<div class="view"><div class="vh"><h1>Approved vendors</h1><span class="sub">Documents are checked for expiry every day</span></div>${scanHtml}
    <section class="panel">${S.vendors.length ? `<table class="grid"><thead><tr><th>Vendor</th><th>CR</th><th>VAT</th><th>Bank account</th><th>Next expiry</th><th>Status</th></tr></thead><tbody>${S.vendors.map(v => {
      const [cls, txt] = vendorTag(v), nx = v.documents.slice().sort((a, b) => (a.expiry_date || '').localeCompare(b.expiry_date || ''))[0];
      return `<tr class="click" onclick="openVendor('${v.id}')"><td style="font-weight:500">${esc(v.name)}<div class="small">${esc(v.id)}</div></td><td class="mono">${esc(v.cr_number)}</td><td class="mono">${esc(v.vat_number || '')}</td>
        <td class="mono">${esc(maskIban(v.iban))}</td><td>${nx ? esc(DOC[nx.doc_type] || nx.doc_type) + ', ' + fmtDate(nx.expiry_date) : ''}</td><td><span class="tag ${cls}">${esc(txt)}</span></td></tr>`;
    }).join('')}</tbody></table>` : '<div class="empty">No approved vendors yet.</div>'}</section></div>`;
}

function viewBank() {
  const list = S.bank_changes.slice().reverse();
  return `<div class="view"><div class="vh"><h1>Bank change requests</h1><span class="sub">Never applied automatically. Every request is frozen until a call to the number on file.</span></div>
    <section class="panel">${list.length ? `<table class="grid"><thead><tr><th>Received</th><th>Vendor</th><th>Requested by</th><th>New account</th><th>Red flags</th><th>Status</th></tr></thead><tbody>${list.map(b => {
      const v = S.vendors.find(v => v.id === b.vendor_id) || {}, flags = J(b.flags) || [];
      const tag = b.status === 'frozen' ? ['t-red', 'Frozen · call needed'] : b.status === 'rejected' ? ['t-grey', 'Rejected'] : ['t-green', 'Approved'];
      const c = S.cases.find(c => c.id === b.case_id);
      return `<tr class="click" onclick="openEmailRow('${b.case_id}', ${lastInboundId(c)})"><td>${fmtDay(b.created_at)} ${fmtTime(b.created_at)}</td><td style="font-weight:500">${esc(v.name || b.vendor_id)}</td><td>${esc(b.sender)}</td>
        <td class="mono">${esc(maskIban(b.new_iban))}</td><td>${flags.map(f => `<span class="flag">${esc(FLAG[f] || f)}</span>`).join(' ') || 'None'}</td><td><span class="tag ${tag[0]}">${tag[1]}</span></td></tr>`;
    }).join('')}</tbody></table>` : '<div class="empty">No bank change requests.</div>'}</section></div>`;
}

function viewAudit() {
  return `<div class="view"><div class="vh"><h1>Audit log</h1><span class="sub">Every tool call The Seal makes is recorded here</span></div>
    <section class="panel"><ol class="act" style="padding-top:10px">${activity(events)}</ol></section></div>`;
}
let policyText = null;
function viewRules() {
  if (policyText === null) { policyText = ''; fetch('/api/policy').then(r => r.text()).then(t => { policyText = t; render(); }); }
  return `<div class="view"><div class="vh"><h1>Rules</h1><span class="sub">policy.yaml · read-only. Exact checks run in code from this file, not in the prompt.</span></div>
    <section class="panel"><pre class="policy">${esc(policyText)}</pre></section></div>`;
}
function viewAbout() {
  const r = S.results;
  return `<div class="view about"><div class="vh"><h1>About The Seal</h1></div><section class="panel" style="padding:4px 20px 14px">
    <p>The Seal onboards suppliers from a plain email and then keeps guarding them. A Claude model reads the documents; deterministic code checks them against the rules in policy.yaml and the registries; action tools refuse anything the checks do not allow. A person is asked only when there is a fraud risk.</p>
    ${r ? `<p><b>Test results</b> (results file <span class="mono">${esc(r.run_id)}</span>): ${r.cases} ${r.split === 'heldout' ? 'held-out cases never used for tuning' : 'test cases'}.
      Decision accuracy <b>${(r.decision_accuracy*100).toFixed(1)}%</b> · fraud attempts stopped <b>${(r.fraud_recall*100).toFixed(1)}%</b> · honest suppliers wrongly flagged <b>${(r.false_escalation_rate*100).toFixed(1)}%</b>.</p>` : ''}
    <p><b>Replay mode</b> plays back real model responses recorded earlier, so the demo runs without API calls. In live mode the same code calls the Anthropic API.</p>
    <p><a href="/">Project overview</a></p></section></div>`;
}

// ------------------------------------------------------------------ drawers: document viewer and vendor record
async function openDoc(id) {
  drawer = {kind:'doc', id: decodeURIComponent(id), data: null}; renderDrawer();
  try { drawer.data = await api(`/api/documents/${id}/evidence`); } catch (e) { drawer.error = e.message; }
  renderDrawer();
}
function openVendor(id) { drawer = {kind:'vendor', id}; renderDrawer(); }
function closeDrawer() { drawer = null; renderDrawer(); }
function hl(i, on) { const b = document.getElementById('hl-' + i); if (b) b.classList.toggle('on', on); }
function renderDrawer() {
  const el = document.getElementById('drawer');
  if (!drawer) { el.innerHTML = ''; return; }
  let title = '', body = '';
  if (drawer.kind === 'doc') {
    const x = drawer.data;
    title = x ? esc(x.filename) : 'Document';
    const box = (b, cls, i) => b ? `<div class="hl ${cls}" ${i !== undefined ? `id="hl-${i}"` : ''} style="left:${b.x*100}%;top:${b.y*100}%;width:${b.w*100}%;height:${b.h*100}%"></div>` : '';
    body = !x ? `<div class="empty">${drawer.error ? esc(drawer.error) : 'Loading...'}</div>` : `<div class="db">
      <div class="pagewrap"><div class="page"><img src="/api/documents/${encodeURIComponent(drawer.id)}/page.png" alt="Page 1 of ${esc(x.filename)}">
        ${x.type_evidence.map(t => box(t.box, 'type')).join('')}${x.fields.map((f, i) => box(f.box, '', i)).join('')}</div></div>
      <div class="why">
        <div><div class="small">Identified as</div><h3>${esc(x.label)} ${x.confidence != null ? `<span class="conf">(confidence ${Number(x.confidence).toFixed(2)})</span>` : ''}</h3>
          <div class="small">${x.language === 'ar' ? 'Arabic document' : x.language === 'en' ? 'English document' : 'Bilingual document'}${x.has_text_layer ? '' : ' · scanned image'}</div></div>
        <div><div class="small" style="margin-bottom:6px">Because</div>${x.type_evidence.length
          ? `<div class="ev">${x.type_evidence.map(t => `<span class="evq" dir="auto">"${esc(t.text)}"</span>`).join('')}</div>`
          : '<div class="note">No text layer to quote from; the type comes from the model reading the page image. The fields it transcribed are below.</div>'}</div>
        <div><div class="small" style="margin-bottom:4px">Extracted fields</div><div class="fields">${x.fields.map((f, i) => `<div class="f" onmouseenter="hl(${i},true)" onmouseleave="hl(${i},false)">
          <span class="small">${esc(f.label)}</span><span><b style="font-weight:500" dir="auto">${esc(f.value)}</b>${f.source_text && f.source_text !== f.value ? `<span class="q" dir="auto">read as "${esc(f.source_text)}"</span>` : ''}${f.box ? '' : x.has_text_layer ? '<span class="q">not located on the page text</span>' : ''}</span>
          <span class="small">${f.confidence != null ? Number(f.confidence).toFixed(2) : ''}</span></div>`).join('')}</div></div>
        <div class="note">Blue boxes: the words that identify the document type. Amber boxes: where each field was found in the PDF's text layer (hover a field). Confidence is the model's own score for the key fields of this document type (lowest shown).</div>
      </div></div>`;
  } else {
    const v = S.vendors.find(v => v.id === drawer.id); if (!v) { drawer = null; el.innerHTML = ''; return; }
    title = esc(v.name);
    const bcs = S.bank_changes.filter(b => b.vendor_id === v.id).map(b => b.case_id);
    const evs = events.filter(e => e.vendor_id === v.id || e.case_id === v.case_id || bcs.includes(e.case_id));
    const [cls, txt] = vendorTag(v);
    body = `<div style="overflow:auto"><div class="kv"><span>Status</span><span><span class="tag ${cls}">${esc(txt)}</span></span>
      <span>Vendor ID</span><span class="mono">${esc(v.id)}</span><span>CR</span><span class="mono">${esc(v.cr_number)}</span><span>VAT</span><span class="mono">${esc(v.vat_number || '')}</span>
      <span>Bank account</span><span class="mono">${esc(v.iban)} · ${esc(v.account_name)}</span><span>Contact</span><span>${esc(v.email)} · ${esc(v.phone)}</span>
      <span>Documents</span><span>${v.documents.map(d => `${esc(DOC[d.doc_type] || d.doc_type)}: ${fmtDate(d.expiry_date)}`).join('<br>')}</span></div>
      ${bcs.length ? `<div class="sect">Bank change requests</div><table class="grid"><tbody>${S.bank_changes.filter(b => b.vendor_id === v.id).map(b => `<tr><td>${fmtDay(b.created_at)}</td><td>${esc(b.sender)}</td><td class="mono">${esc(maskIban(b.new_iban))}</td><td>${esc(b.status)}</td></tr>`).join('')}</tbody></table>` : ''}
      <div class="sect">History</div><ol class="act">${activity(evs)}</ol></div>`;
  }
  el.innerHTML = `<div class="scrim" onclick="closeDrawer()"></div><aside class="drawer" role="dialog" aria-label="${title}"><div class="dh"><h2>${title}</h2><button onclick="closeDrawer()">Close</button></div>${body}</aside>`;
}

// ------------------------------------------------------------------ clock (demo time only; never the real wall clock)
let shownClock = null, clockAnim = null;
function setClock(iso) {
  if (!iso) return;
  const target = D(iso).getTime();
  if (shownClock !== null && target - shownClock > 3600e3) {
    const from = shownClock, t0 = performance.now(), dur = 1600; cancelAnimationFrame(clockAnim);
    document.getElementById('clock').classList.add('jump');
    const tick = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); paintClock(from + (target - from) * e);
      if (k < 1) clockAnim = requestAnimationFrame(tick); else { shownClock = target; document.getElementById('clock').classList.remove('jump'); } };
    clockAnim = requestAnimationFrame(tick); shownClock = target; return;
  }
  shownClock = target; paintClock(target);
}
function paintClock(ms) {
  const d = new Date(ms);
  document.getElementById('clock-t').textContent = d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
  document.getElementById('clock-d').textContent = d.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
}

// ------------------------------------------------------------------ presenter overlay (hidden by default)
const STEPS = [
  {title:'The procurement inbox', body:'This is the procurement team\'s inbox. Suppliers email their papers here: commercial registration, VAT certificate, bank letter, GOSI certificate. The Seal reads every email as it arrives, checks every document, and only asks a person when there is a fraud risk.'},
  {title:'Sunday 09:12 · Al Noor Trading applies', srv:0, open:'demo_1_al_noor_clean', body:'Al Noor sends four documents, two in Arabic. The Seal reads each one, checks the company with Wathq and ZATCA, compares names and numbers across documents, then approves Al Noor and sends a welcome email. Click a document to see how it knew what it was.'},
  {title:'Sunday 10:40 · Rawabi Logistics applies', srv:1, open:'demo_2_rawabi_expired_vat', body:'Rawabi\'s VAT certificate expired on 10 October. That is something the supplier can fix, so The Seal emails Rawabi asking for exactly that document. Nobody else is involved.'},
  {title:'Tuesday 14:05 · Rawabi replies', srv:2, open:'demo_2_rawabi_expired_vat', body:'Two days later Rawabi replies with a renewed certificate. The Seal reads only the new document, runs every check again, and approves Rawabi. The old certificate stays on file, marked as replaced.'},
  {title:'Tuesday 15:30 · Gulf Steel applies', srv:3, open:'demo_3_gulf_steel_bank_mismatch', body:'Gulf Steel\'s bank letter is in the name of a different company. Paying someone other than the supplier is a classic fraud pattern, so The Seal stops, does not email the supplier, and asks the manager.'},
  {title:'The manager rejects Gulf Steel', srv:4, open:'demo_3_gulf_steel_bank_mismatch', body:'The manager reviews the two names side by side and rejects the supplier. Nothing is left waiting for a decision.'},
  {title:'Wednesday 08:47 · "Al Noor" asks to change bank account', srv:5, open:'demo_4_al_noor_bank_change', body:'An email from alnoor-trading.co (Al Noor\'s real domain is .com.sa) asks to move Al Noor\'s payments to a new bank. The Seal cannot change bank details. It freezes the request, holds payments, and asks the manager to call the number on file.'},
  {title:'The manager calls Al Noor', srv:6, open:'demo_4_al_noor_bank_change', body:'Al Noor never sent that email. The manager rejects the change. Bank details stay as they were, and the request is recorded on Al Noor\'s vendor record.'},
  {title:'Eleven months later · the daily expiry scan', srv:7, view:'vendors', body:'It is now 30 September 2027. Al Noor\'s commercial registration expires in 20 days and Rawabi\'s VAT certificate in 10, so The Seal asks both to renew. Rawabi\'s GOSI certificate has already expired, so its payments are on hold until a new one arrives.'},
  {title:'Summary', view:'inbox', body:'Five emails received. Three handled with no person involved. The manager stepped in twice, both times to stop possible fraud. Then The Seal kept guarding: two renewal requests and one payment hold, with nothing left waiting for a decision.'},
];
let step = 0, presBusy = false;
try { step = Math.min(parseInt(sessionStorage.getItem('sealStep') || '0', 10) || 0, STEPS.length - 1); } catch {}
function setStep(n) { step = n; try { sessionStorage.setItem('sealStep', String(n)); } catch {} renderPresenter(); }
function renderPresenter() {
  const s = STEPS[step];
  document.getElementById('p-step').textContent = `Step ${step} of ${STEPS.length - 1}`;
  document.getElementById('p-title').textContent = s.title;
  document.getElementById('p-body').textContent = s.body;
  const b = document.getElementById('p-next'); b.disabled = presBusy || step >= STEPS.length - 1; b.textContent = presBusy ? 'Working...' : 'Next';
}
function applyView(s) { if (s.open) { openCase = s.open; openEmail = null; view = 'inbox'; drawer = null; } else if (s.view) { view = s.view; drawer = null; } }
async function presNext() {
  if (presBusy || step >= STEPS.length - 1) return;
  const s = STEPS[step + 1];
  presBusy = true; setStep(step + 1); applyView(s); render();
  try { if (s.srv !== undefined) { await api(`/api/demo/step/${s.srv}`, {}); await waitQuiet(); } }
  catch (e) { document.getElementById('p-msg').textContent = e.message; }
  presBusy = false; await refresh(); applyView(s); render(); renderPresenter();
}
async function presBack() { if (presBusy || step === 0) return; await jumpTo(step - 1); }
async function presRestart() { if (presBusy) return; await jumpTo(0); }
async function jumpTo(n) {
  presBusy = true; renderPresenter();
  const runs = STEPS.slice(1, n + 1).filter(s => s.srv !== undefined).length;
  events = []; checksCache = {}; openChecks = {}; drawer = null; firstLoad = true; seenEvents.clear(); seenEmails.clear(); seenDocs.clear();
  await api(`/api/demo/goto/${runs}`, {});
  await waitQuiet(1200);
  setStep(n); applyView(STEPS[n]); if (n === 0) { openCase = null; view = 'inbox'; }
  presBusy = false; firstLoad = true; await refresh(); renderPresenter();
}
function waitQuiet(ms = 2600) {
  return new Promise(res => { let last = -1, quiet = 0; const t = setInterval(async () => {
    const top = events.length ? events[events.length - 1].id : 0;
    if (top !== last) { last = top; quiet = 0; } else if ((quiet += 400) >= ms) { clearInterval(t); res(); } }, 400); });
}
async function loadLiveCases() {
  try { const list = await api('/api/live/cases'); document.getElementById('p-live').innerHTML = list.map(n => `<option>${esc(n)}</option>`).join(''); } catch {}
}
async function processLive() {
  const name = document.getElementById('p-live').value, msg = document.getElementById('p-msg');
  msg.textContent = '';
  try { await api('/api/live', {case: name}); msg.textContent = `Processing ${name} live through the Anthropic API...`; pendingLive = 'live-'; view = 'inbox'; }
  catch (e) { msg.textContent = e.message; }
}
let pendingLive = null;
document.addEventListener('keydown', e => {
  if (['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'escape' && drawer) { closeDrawer(); return; }
  if (k === 'arrowright' || k === 'n') { e.preventDefault(); presNext(); }
  else if (k === 'b') presBack();
  else if (k === 'r') presRestart();
  else if (k === 'h') { const p = document.getElementById('presenter'); p.hidden = !p.hidden; }
});

// ------------------------------------------------------------------ data loop (the dashboard reads only the store)
let refreshing = false, again = false;
async function refresh() {
  if (refreshing) { again = true; return; }
  refreshing = true;
  try {
    const [st, ev] = await Promise.all([api('/api/state'), api('/api/events')]);
    S = st; events = ev; setClock(S.now);
    if (pendingLive) { const lc = S.cases.filter(c => isLive(c.id)).slice(-1)[0]; if (lc) { openCase = lc.id; openEmail = null; pendingLive = null; } }
    render();
  } finally { refreshing = false; if (again) { again = false; refresh(); } }
}
function markBusy() {
  busy = true; clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { busy = false; render(); }, 2200);
}
async function boot() {
  await refresh(); renderPresenter(); loadLiveCases();
  const es = new EventSource('/api/stream');
  let t = null;
  es.onmessage = () => { markBusy(); clearTimeout(t); t = setTimeout(refresh, 80); };
}
boot();
</script>
